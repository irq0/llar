---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
        args:
          - --allow-multiple-documents
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: debug-statements
      - id: mixed-line-ending
      - id: detect-private-key
      - id: destroyed-symlinks
      - id: check-shebang-scripts-are-executable
      - id: check-case-conflict

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 38980559e3a605691d6579f96222c30778e5a69e  # frozen: 3.0.0
    hooks:
      - id: forbid-binary
        exclude: >-
          (?x)^(
            resources/status/img/.*|
            doc/img/.*|
            resources/nlp/models.*|
            tools/save-to-llar-extension/icons/icon-.*\.png
          )$
      - id: git-check

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        args: ["--ignore-words-list", "edn,juxt", "--ignore-regex=.*codespell-ignore$"]
        exclude: >-
          (?x)^(
            resources/stopwords_.*|
            src/u1f596/regex\.clj|
            package-lock\.json
          )$

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: b82a6c8896e491b9cb377a99ff3412131920681b  # frozen: v0.23.2
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: 99470f5e12208ff0fb17ab81c3c494f7620a1d8d  # frozen: v0.11.0
    hooks:
      - id: shellcheck

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: 'f12edd9c7be1c20cfa42420fd0e6df71e42b51ea'  # frozen: v4.0.0-alpha.8
    hooks:
    -   id: prettier
        types_or: [css, javascript]

  - repo: https://github.com/thibaudcolas/pre-commit-stylelint
    rev: 5550a364f2b5d3a9e731a9f4e231c5dc8c5f2e5b  # frozen: v16.26.1
    hooks:
    -   id: stylelint
        args: ["--fix"]
        additional_dependencies: ['stylelint@16.26.1', 'stylelint-config-standard@39.0.1']

  - repo: local
    hooks:
      - id: cljfmt
        name: cljfmt
        language: system
        entry: cljfmt check
        pass_filenames: false
        types: [clojure]
        exclude: '(^|/)\.#'

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: 0a9c8bc1bdd34395466aaccbe6e095dfc8bf2bfa  # frozen: v10.1.0
    hooks:
    - id: cspell
      args:
        - --no-must-find-files
        - --no-progress
        - --no-summary
        - --gitignore
        - --unique
      files: >-
          (?x)^(
          doc/.*|
          README\.md
          )$
