---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
        args:
          - --allow-multiple-documents
      - id: check-json
      - id: check-xml
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: debug-statements
      - id: mixed-line-ending
      - id: detect-private-key
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-case-conflict

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0494aa7fa1314e98913a41227d8f0a515b2c1049  # frozen: 0.38.2
    hooks:
      - id: check-compose-spec
      - id: check-dependabot
      - id: check-github-workflows

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
        args: [-shellcheck=]

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 38980559e3a605691d6579f96222c30778e5a69e  # frozen: 3.0.0
    hooks:
      - id: forbid-binary
        exclude: >-
          (?x)^(
            resources/status/img/.*|
            doc/img/.*|
            resources/nlp/models.*|
            tools/save-to-llar-extension/icons/icon-.*\.png
          )$
      - id: git-check

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        args: ["--ignore-words-list", "edn,juxt", "--ignore-regex=.*codespell-ignore$"]
        exclude: >-
          (?x)^(
            resources/stopwords_.*|
            src/u1f596/regex\.clj|
            package-lock\.json
          )$

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 916ad0aaa108c64d294101002066f530ea170b10  # frozen: v0.23.3
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: 'f12edd9c7be1c20cfa42420fd0e6df71e42b51ea'  # frozen: v4.0.0-alpha.8
    hooks:
    -   id: prettier
        types_or: [css, javascript]

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: 7ab6b7f5c5befd162fb5ddddc4af4c1b4fbfe11d  # frozen: v10.13.0
    hooks:
    -   id: eslint
        additional_dependencies:
          - 'eslint@10.13.0'
          - '@eslint/js@10.0.1'
          - 'globals@17.13.0'

  - repo: https://github.com/thibaudcolas/pre-commit-stylelint
    rev: 5550a364f2b5d3a9e731a9f4e231c5dc8c5f2e5b  # frozen: v16.26.1
    hooks:
    -   id: stylelint
        args: ["--fix"]
        additional_dependencies: ['stylelint@16.26.1', 'stylelint-config-standard@39.0.1']

  - repo: local
    hooks:
      - id: cljfmt
        name: cljfmt
        language: system
        entry: cljfmt check
        pass_filenames: false
        types: [clojure]
        exclude: '(^|/)\.#'

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: 058f44e47719e80d8f1e597a235310b60e937860  # frozen: v10.2.0
    hooks:
    - id: cspell
      args:
        - --no-must-find-files
        - --no-progress
        - --no-summary
        - --gitignore
        - --unique
      files: >-
          (?x)^(
          doc/.*|
          README\.md
          )$
