version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    groups:
      container-images:
        patterns:
          - "*"

  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    groups:
      compose-images:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    groups:
      python-runtime:
        patterns:
          - "*"

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    # Stylelint 17 cannot resolve ESM shareable configs from pre-commit's
    # isolated Node environment yet.
    ignore:
      - dependency-name: "thibaudcolas/pre-commit-stylelint"
        update-types:
          - version-update:semver-major
      - dependency-name: stylelint
        update-types:
          - version-update:semver-major
      - dependency-name: stylelint-config-standard
        update-types:
          - version-update:semver-major
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
