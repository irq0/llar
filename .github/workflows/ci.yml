name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'wip/**'
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  format:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    - uses: actions/cache@v6
      id: cljfmt-cache
      with:
        path: ~/.local/bin/cljfmt
        key: cljfmt-0.16.6-${{ runner.os }}-${{ runner.arch }}
    - name: Install cljfmt
      if: steps.cljfmt-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/.local/bin
        archive="$RUNNER_TEMP/cljfmt.tar.gz"
        curl -fsSL \
          https://github.com/weavejester/cljfmt/releases/download/0.16.6/cljfmt-0.16.6-linux-amd64-static.tar.gz \
          -o "$archive"
        echo "a01efb0e42a10d0f448f0dfd6740d62ced058d6649487c608710c6378b73f1cb  $archive" \
          | sha256sum --check --status
        tar -xzf "$archive" -C ~/.local/bin
    - name: Add ~/.local/bin to PATH
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
      with:
        prek-version: 0.5.7
        sha256: e238e5a6b4e384e8d18f33d3c3b1a329be0e1237f77ac6e021e641ddd3a2bab6

  lint:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
      with:
        dockerfile: docker/Dockerfile
        config: .hadolint.yaml
    - uses: actions/cache@v6
      id: clj-kondo-cache
      with:
        path: ~/.local/bin/clj-kondo
        key: clj-kondo-2026.05.25-${{ runner.os }}-${{ runner.arch }}
    - name: Install clj-kondo
      if: steps.clj-kondo-cache.outputs.cache-hit != 'true'
      run: |
        installer="$RUNNER_TEMP/install-clj-kondo"
        curl -fsSL \
          https://raw.githubusercontent.com/clj-kondo/clj-kondo/29b7bcb64c9b6d231799cc51b9e8a389cbc6bc1d/script/install-clj-kondo \
          -o "$installer"
        chmod +x "$installer"
        "$installer" --version 2026.05.25 --dir ~/.local/bin
    - name: Add ~/.local/bin to PATH
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Run clj-kondo
      run: clj-kondo --lint src:test:.clj-kondo/hooks

  test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      checks: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        fetch-tags: true
        filter: tree:0
        persist-credentials: false
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'maven'
        cache-dependency-path: 'project.clj'
        cache-path: |
          ~/.m2/repository
          ~/.lein
        cache-read-only: ${{ github.event_name == 'pull_request' }}
    - name: Install Leiningen
      run: |
        mkdir -p ~/.local/bin
        curl -fsSL \
          https://raw.githubusercontent.com/technomancy/leiningen/40227328d4a9c8945362d6d626d19c2449175df6/bin/lein \
          -o ~/.local/bin/lein
        chmod +x ~/.local/bin/lein
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 'lts/*'
        cache: 'npm'
    - name: Install npm dependencies
      run: npm ci
    - name: Install browser asset tools
      run: sudo apt update && sudo apt-get install -y libarchive-tools wget
    - name: Prepare test reports
      run: mkdir -p target/test-results
    - name: Run metadata extraction tests
      id: metadata-tests
      continue-on-error: true
      run: |
        set +e
        node --test \
          --test-reporter=spec \
          --test-reporter=junit \
          --test-reporter-destination=stdout \
          --test-reporter-destination=target/test-results/node.xml \
          tools/readability/test/*.test.js \
          tools/value-inspector/test/*.test.js \
          2>&1 | tee target/test-results/node.log
        test_status=${PIPESTATUS[0]}
        set -e
        if [[ -s target/test-results/node.xml ]]; then
          node tools/normalize-node-junit.mjs \
            target/test-results/node.xml "Node.js tests"
        fi
        exit "$test_status"
    - name: Install browser test assets
      run: make bootstrap jquery datatables
    - name: Run frontend browser integration tests
      id: browser-tests
      continue-on-error: true
      run: |
        set +e
        node --test \
          --test-reporter=spec \
          --test-reporter=junit \
          --test-reporter-destination=stdout \
          --test-reporter-destination=target/test-results/browser.xml \
          tools/frontend/test/*.test.mjs \
          2>&1 | tee target/test-results/browser.log
        test_status=${PIPESTATUS[0]}
        set -e
        if [[ -s target/test-results/browser.xml ]]; then
          node tools/normalize-node-junit.mjs \
            target/test-results/browser.xml "Browser integration tests"
        fi
        exit "$test_status"
    - name: Install dependencies
      run: lein with-profile +test deps
    - name: Run tests with coverage
      id: clojure-tests
      continue-on-error: true
      run: |
        set +e
        lein with-profile +test run -m kaocha.runner \
          --plugin kaocha.plugin/cloverage \
          > target/test-results/clojure.log 2>&1
        test_status=$?
        set -e
        if [[ -s target/junit.xml ]]; then
          mv target/junit.xml target/test-results/clojure.xml
        fi
        if [[ "$test_status" -eq 0 ]]; then
          tail -n 80 target/test-results/clojure.log
        else
          echo "::group::Clojure test output (last 200 lines)"
          tail -n 200 target/test-results/clojure.log
          echo "::endgroup::"
        fi
        exit "$test_status"
    - name: Validate expected test reports
      id: test-reports
      if: always()
      continue-on-error: true
      run: |
        report_status=0
        for report in \
          target/test-results/node.xml \
          target/test-results/browser.xml \
          target/test-results/clojure.xml
        do
          if [[ ! -s "$report" ]]; then
            echo "::error file=$report::Expected test report was not generated"
            report_status=1
          fi
        done
        exit "$report_status"
    - name: Upload coverage to Codecov
      if: ${{ !cancelled() && hashFiles('target/coverage/codecov.json') != '' }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: target/coverage/codecov.json
        disable_search: true
        fail_ci_if_error: false
    - name: Upload test results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: test-results
        path: |
          target/test-results/
          target/coverage/
        if-no-files-found: error
        retention-days: 14
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
      if: ${{ !cancelled() }}
      with:
        files: |
          target/test-results/node.xml
          target/test-results/browser.xml
          target/test-results/clojure.xml
        check_name: Test results
        comment_mode: off
        job_summary: true
        check_run_annotations: none
        report_suite_logs: error
        action_fail_on_inconclusive: true
        test_file_prefix: -${{ github.workspace }}/
    - name: Fail job when tests failed
      if: >-
        always() &&
        (steps.metadata-tests.outcome == 'failure' ||
         steps.browser-tests.outcome == 'failure' ||
         steps.clojure-tests.outcome == 'failure' ||
         steps.test-reports.outcome == 'failure')
      run: exit 1

  docker:
    runs-on: ubuntu-26.04
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image-ref: ${{ steps.image.outputs.ref }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true
        filter: tree:0

    - name: Log in to the Container registry
      uses: docker/login-action@783ae9cac559640a24c9212dfa6cd9e998252f9a
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'maven'
        cache-dependency-path: 'project.clj'
        cache-path: |
          ~/.m2/repository
          ~/.lein
    - name: Install Leiningen
      run: |
        mkdir -p ~/.local/bin
        curl -fsSL \
          https://raw.githubusercontent.com/technomancy/leiningen/40227328d4a9c8945362d6d626d19c2449175df6/bin/lein \
          -o ~/.local/bin/lein
        chmod +x ~/.local/bin/lein
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Cache frontend assets
      id: frontend-assets-cache
      uses: actions/cache@v6
      with:
        path: |
          resources/status/bootstrap
          resources/status/datatables
          resources/status/fontawesome
          resources/status/ibmplex
          resources/status/jquery
        key: frontend-assets-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}

    - name: Install frontend asset tools
      if: steps.frontend-assets-cache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y make libarchive-tools wget

    - name: Build application
      run: make

    - name: Set version
      run: echo "VERSION=$(lein pprint --no-pretty -- :version)" >> "$GITHUB_ENV"

    - name: docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}},value=${{ env.VERSION }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
          type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
          type=semver,pattern={{major}},value=${{ env.VERSION }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
          type=sha,priority=1000
          type=raw,value=devel,enable=true
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

    - name: build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        file: docker/Dockerfile
        pull: true
        build-args: |
          VERSION=${{ env.VERSION }}
          UBUNTU_MIRROR=http://azure.archive.ubuntu.com/ubuntu
        push: true
        cache-from: type=gha,scope=llar-image
        cache-to: type=gha,mode=max,scope=llar-image
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: select e2e image
      id: image
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        IMAGE_REF="$(printf '%s\n' "$TAGS" | grep ':sha-' | head -n1)"
        test -n "$IMAGE_REF"
        echo "ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

    - name: Scan container image for vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ steps.image.outputs.ref }}
        scanners: vuln
        vuln-type: os,library
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        format: sarif
        output: trivy-results.sarif
        limit-severities-for-sarif: true
        exit-code: '0'
        hide-progress: true

    - name: Upload vulnerability results
      if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: trivy-results.sarif
        category: container-image

  compose-e2e:
    runs-on: ubuntu-26.04
    needs: docker
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_FILE: docker/docker-compose.yaml:docker/docker-compose.demo.yaml
    steps:
    - uses: actions/checkout@v7

    - name: Log in to the Container registry
      uses: docker/login-action@783ae9cac559640a24c9212dfa6cd9e998252f9a
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull image built by docker job
      run: docker pull '${{ needs.docker.outputs.image-ref }}'

    - name: Create CI credentials
      run: |
        cat > docker/credentials.edn <<'EOF'
        {:twitter-api {}
         :lwn {}
         :imap {}
         :smtp {}
         :zotero {}
         :podcast-token "ci"
         :reddit {}}
        EOF

    - name: Validate compose
      env:
        LLAR_IMAGE: ${{ needs.docker.outputs.image-ref }}
      run: docker compose config

    - name: Start compose stack
      env:
        LLAR_IMAGE: ${{ needs.docker.outputs.image-ref }}
      run: docker compose up -d

    - name: Wait for application
      run: |
        timeout 180 bash -c '
          until curl -fsS http://localhost:9999/metrics >/dev/null; do
            docker compose ps
            sleep 5
          done
        '

    - name: Populate deterministic demo content
      run: |
        timeout 180 bash -c '
          until response="$(curl -fsS -X POST \
            http://localhost:9999/api/schedule/demo-sources/run)" \
            && grep -Eq "\"result\"[[:space:]]*:[[:space:]]*\"triggered\"" \
              <<<"$response"; do
            sleep 3
          done
          printf "%s\n" "$response"
        '
        timeout 180 bash -c '
          until curl -fsS \
            -o /tmp/llar-demo-items.html \
            http://localhost:8023/reader/group/source-tag/demo/source/all/items \
            && grep -q "Local-first tools" /tmp/llar-demo-items.html \
            && grep -q "Designing for ownership" /tmp/llar-demo-items.html \
            && grep -q "Community archives rediscover" /tmp/llar-demo-items.html \
            && grep -q "The software that keeps working" /tmp/llar-demo-items.html; do
            sleep 3
          done
        '
        timeout 180 bash -c '
          until response="$(curl -fsS -X POST \
            http://localhost:9999/api/schedule/update-todays-vibe/run)" \
            && grep -Eq "\"result\"[[:space:]]*:[[:space:]]*\"triggered\"" \
              <<<"$response"; do
            sleep 3
          done
          printf "%s\n" "$response"
        '
        timeout 180 bash -c '
          attempt=0
          until status="$(curl -sS \
            -o /tmp/llar-demo-vibe.html \
            -w "%{http_code}" \
            http://localhost:8023/reader/tools/todays-vibe)" \
            && [[ "$status" == 200 ]] \
            && grep -q "data-vibe-cluster-id" /tmp/llar-demo-vibe.html; do
            attempt=$((attempt + 1))
            if (( attempt == 1 || attempt % 10 == 0 )); then
              clusters="$(grep -Ec "data-vibe-cluster-id" \
                /tmp/llar-demo-vibe.html 2>/dev/null || true)"
              cross_source="$(grep -Ec \
                "data-vibe-source-count=\"([2-9]|[1-9][0-9]+)\"" \
                /tmp/llar-demo-vibe.html 2>/dev/null || true)"
              echo "Waiting for Vibe cluster: HTTP ${status:-000}, clusters=$clusters, cross-source=$cross_source"
            fi
            sleep 3
          done
        '

    - name: Run e2e checks
      run: |
        curl -fsS http://localhost:9999/metrics >/dev/null
        curl -fsS -o /tmp/llar-demo-items.html http://localhost:8023/reader/group/source-tag/demo/source/all/items
        grep -q "Local-first tools" /tmp/llar-demo-items.html
        curl -fsS -o /tmp/llar-demo-saved.html http://localhost:8023/reader/tools/saved-overview
        grep -q "Open hardware turns repair manuals" /tmp/llar-demo-saved.html
        curl -fsS -o /tmp/llar-demo-continue.html http://localhost:8023/reader/tools/continue-reading
        grep -q "Open hardware turns repair manuals" /tmp/llar-demo-continue.html
        curl -fsS -o /tmp/llar-demo-gems.html 'http://localhost:8023/reader/tools/gems?browse=true'
        grep -q "A new night-train map" /tmp/llar-demo-gems.html
        curl -fsS -o /tmp/llar-demo-vibe.html http://localhost:8023/reader/tools/todays-vibe
        grep -q "data-vibe-cluster-id" /tmp/llar-demo-vibe.html
        curl -fsS -o /tmp/llar-demo-image.svg http://localhost:8023/static/demo/local-first.svg
        grep -q "LOCAL FIRST" /tmp/llar-demo-image.svg

    - uses: actions/setup-node@v7
      if: github.ref == 'refs/heads/main'
      with:
        node-version: 'lts/*'
        cache: 'npm'

    - name: Install screenshot dependencies
      if: github.ref == 'refs/heads/main'
      run: npm ci

    - name: Capture README screenshots
      if: github.ref == 'refs/heads/main'
      run: npm run demo:screenshots

    - name: Upload README screenshots
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v7
      with:
        name: demo-screenshots
        path: target/demo-media/*.png
        if-no-files-found: error
        retention-days: 1

    - name: Upload screenshot diagnostics
      if: failure() && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v7
      with:
        name: demo-screenshot-diagnostics
        path: target/demo-media/diagnostics/
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload compose E2E response diagnostics
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: compose-e2e-responses
        path: |
          /tmp/llar-demo-*.html
          /tmp/llar-demo-*.svg
        if-no-files-found: ignore
        retention-days: 7

    - name: Compose logs
      if: always()
      run: docker compose logs --no-color

    - name: Cleanup compose stack
      if: always()
      run: docker compose down -v --remove-orphans

  docs:
    runs-on: ubuntu-26.04
    needs:
      - docker
      - compose-e2e
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v7

    - uses: actions/configure-pages@v6

    - name: Download README screenshots
      uses: actions/download-artifact@v8
      with:
        name: demo-screenshots
        path: ${{ runner.temp }}/llar-demo-screenshots

    - name: Cache frontend assets
      id: frontend-assets-cache
      uses: actions/cache@v6
      with:
        path: |
          resources/status/bootstrap
          resources/status/datatables
          resources/status/fontawesome
          resources/status/ibmplex
          resources/status/jquery
        key: frontend-assets-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}

    - name: Install docs asset tools
      if: steps.frontend-assets-cache.outputs.cache-hit != 'true'
      run: sudo apt update && sudo apt-get install -y make libarchive-tools wget

    - name: Log in to the Container registry
      uses: docker/login-action@783ae9cac559640a24c9212dfa6cd9e998252f9a
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull image built by docker job
      run: docker pull '${{ needs.docker.outputs.image-ref }}'

    - name: Generate docs
      run: |
        mkdir -p "$RUNNER_TEMP/llar-docs"
        chmod 777 "$RUNNER_TEMP/llar-docs"
        docker run --rm \
          -v "$RUNNER_TEMP/llar-docs:/out" \
          '${{ needs.docker.outputs.image-ref }}' \
          --write-docs /out

    - name: Copy docs assets
      run: make docs-assets DOCS_OUT="$RUNNER_TEMP/llar-docs"

    - name: Include README screenshots
      run: |
        test -s "$RUNNER_TEMP/llar-demo-screenshots/reader.png"
        test -s "$RUNNER_TEMP/llar-demo-screenshots/dashboard.png"
        mkdir -p "$RUNNER_TEMP/llar-docs/demo/main"
        cp "$RUNNER_TEMP/llar-demo-screenshots"/*.png \
          "$RUNNER_TEMP/llar-docs/demo/main/"

    - uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ runner.temp }}/llar-docs

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
